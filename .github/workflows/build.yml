name: Build website and Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "No zip to unpack - nothing to do."; exit 0; fi
          rm -rf /tmp/x && mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          SRC=$(dirname "$(find /tmp/x -maxdepth 3 -name capacitor.config.json | head -n1)")
          echo "Project found in: $SRC"
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files"
          git push

  website:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check files are there
        run: test -d public || (echo "The public folder is missing. Upload the project zip to the repo first." && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check files are there
        run: test -f capacitor.config.json || (echo "Project files missing. Upload the project zip to the repo first." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Create Android project + icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#6d28d9' --iconBackgroundColorDark '#6d28d9'
      - name: Fixed signing key + increasing version code
        run: |
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("${GITHUB_WORKSPACE}/signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
          }
          GRADLE
      - name: Copy web files into the app
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MBBS-Tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MBBS-Tracker.apk \
            --title "MBBS Tracker - build ${{ github.run_number }}" \
            --notes "Debug APK. Download MBBS-Tracker.apk on your phone and install it."
